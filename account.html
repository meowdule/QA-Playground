<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>계정 정보 · QA Playground</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="page-site">
  <header class="site-header site-header--auth-only">
    <div class="site-header-inner site-header-inner--center">
      <a class="site-logo" href="./index.html">QA Playground</a>
    </div>
  </header>

  <main class="site-main site-main-auth">
    <div class="auth-shell">
      <h1 class="auth-title">정보 수정</h1>
      <p id="accountEmail" class="auth-sub muted"></p>
      <form id="formAccount" class="auth-form-site">
        <label class="auth-label">표시 이름 (닉네임)
          <input name="displayName" id="accountName" type="text" maxlength="24" required class="auth-input" />
        </label>
        <button type="submit" class="btn-site-primary btn-site-block">저장</button>
      </form>
      <p class="auth-footer-link"><a id="linkBack" href="./index.html">← 돌아가기</a></p>
    </div>
  </main>

  <script defer src="./js/core/storage.js"></script>
  <script defer src="./js/pages/account.js"></script>
</body>
</html>
