# GitHub Pages — 공식 static 템플릿과 동일한 권한·동시성·액션 버전에 맞춤.
# 실패 시 Actions 로그에서 "Resource not accessible"이면 저장소 Settings → Actions → General
# 에서 Workflow permissions가 "Read and write"인지, Pages가 GitHub Actions 소스인지 확인.
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - demo-generator
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 진행 중인 배포를 취소하면 upload 직후 deploy가 끊겨 실패하는 경우가 있어 false 권장.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
